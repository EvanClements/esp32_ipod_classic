name: Build Firmware

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache ESP-ADF
        id: cache-adf
        uses: actions/cache@v4
        with:
          path: /opt/esp-adf
          key: esp-adf-v2.7-shallow

      - name: Clone ESP-ADF
        if: steps.cache-adf.outputs.cache-hit != 'true'
        run: |
          git clone --branch v2.7 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/espressif/esp-adf.git /opt/esp-adf

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          export ADF_PATH=/opt/esp-adf
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/esp32_ipod_classic.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flasher_args.json
